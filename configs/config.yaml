# Model Configuration
model:
  name: "resnet18"
  pretrained: true
  num_classes: 2

# Training Hyperparameters
training:
  batch_size: 32
  learning_rate: 0.001  # Augmenté de 0.0001 à 0.001
  epochs: 20
  optimizer: "adam"
  weight_decay: 0.00001
  use_focal_loss: true  # Activation de la Focal Loss
  use_weighted_sampling: true  # Activation du weighted sampling

# Data Preprocessing
preprocessing:
  image_size: 224
  mean: [0.5, 0.5, 0.5]  # Valeurs adaptées aux radiographies
  std: [0.25, 0.25, 0.25]  # Valeurs adaptées aux radiographies

# Evaluation
evaluation:
  threshold: 0.6  # Seuil optimal déterminé par vos tests
  metrics: ["accuracy", "precision", "recall", "f1_score", "specificity", "ppv", "npv"]

# Logging and Tracking
logging:
  project_name: "chest-xray-pneumonia"
  experiment_name: "optimized-resnet18"